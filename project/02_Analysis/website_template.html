<style>
:root{--bg:#F5F2EA;--ink:#1F2A24;--soft:#3A443E;--muted:#6E736B;--line:#DDD8CC}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Work Sans",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:40px 24px 96px}
.lang{display:flex;justify-content:flex-end;gap:2px;margin-bottom:22px}
.lang a{font-size:13.5px;letter-spacing:.04em;text-decoration:none;color:var(--muted);padding:4px 9px;border-radius:3px}
.lang a.on{color:var(--ink);background:#E7E1D3;font-weight:600}
.lang a:hover{color:var(--ink)}
h1{font:600 clamp(40px,6.4vw,72px)/1.02 Fraunces,Georgia,serif;margin:0 0 18px;letter-spacing:-.015em}
h2{font:600 clamp(26px,3.4vw,34px)/1.12 Fraunces,Georgia,serif;margin:0 0 10px;letter-spacing:-.01em}
p{margin:0 0 12px}
.lede{font-size:clamp(17px,2vw,20px);max-width:720px;color:var(--soft)}
.note{color:var(--muted);font-size:13.5px}
section{padding:64px 0;border-top:1px solid var(--line)}
.top{padding-top:0;border-top:0}
.intro{max-width:720px;color:var(--soft);margin-bottom:28px}
.seasons{display:flex;flex-wrap:wrap;gap:18px;margin:18px 0 0;font-size:14px;color:var(--soft)}
.seasons span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:var(--c)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:36px;align-items:center;margin-top:36px}
@media(max-width:860px){.hero{grid-template-columns:1fr}}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:"Work Sans",system-ui,sans-serif}
.cal{list-style:none;margin:0;padding:0;font-size:14.5px}
.cal li{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:3px 8px;border-radius:3px;cursor:pointer}
.cal li:hover,.cal li.on{background:#EAE5D8}
.cal i{width:10px;height:10px;border-radius:50%}
.cal small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.ring{cursor:pointer;transition:opacity .2s}
.dim .ring{opacity:.22}.dim .ring.on{opacity:1}
.detail{display:grid;grid-template-columns:300px minmax(0,1fr);gap:40px}
@media(max-width:860px){.detail{grid-template-columns:1fr}}
.dname{font:600 40px/1.05 Fraunces,Georgia,serif;margin:0}
.dlang{color:var(--muted);margin:6px 0 22px}
.facts{margin:0;padding:0;list-style:none}
.facts li{padding:9px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px}
.facts b{font-weight:500}
.facts span{color:var(--soft);text-align:right}
.pick{margin-top:22px;font-size:14px;color:var(--muted)}
select{font:inherit;padding:6px 8px;border:1px solid var(--line);background:#FBF9F4;border-radius:3px;color:var(--ink)}
.btn{font:inherit;font-size:14px;background:none;border:1px solid var(--line);padding:6px 12px;border-radius:3px;cursor:pointer;color:var(--soft)}
.btn:hover{background:#EAE5D8}
.method{columns:2 320px;column-gap:40px;color:var(--soft);font-size:15px}
.method p{break-inside:avoid}
footer{margin-top:40px;color:var(--muted);font-size:13px}
.hl{cursor:pointer}
</style>
</head>
<body>
<main>
<nav class="lang" id="lang"></nav>
<section class="top">
  <h1 id="t-title"></h1>
  <p class="lede" id="t-lede"></p>
  <p class="note" id="t-meta"></p>
  <div class="seasons" id="t-seasons"></div>
  <div class="hero"><div id="dial"></div><ol class="cal" id="cal"></ol></div>
  <p class="note" style="margin-top:14px" id="t-dialnote"></p>
</section>
<section id="detail-sec">
  <div class="detail">
    <div>
      <p class="dname" id="dname"></p>
      <p class="dlang" id="dlang"></p>
      <ul class="facts" id="facts"></ul>
      <p class="pick"><span id="t-choose"></span> <select id="sel"></select></p>
    </div>
    <div>
      <h2 style="font-size:22px" id="t-every"></h2>
      <p class="note" id="hmnote"></p>
      <div id="heat"></div>
    </div>
  </div>
</section>
<section><h2 id="t-ridge"></h2><p class="intro" id="t-ridgeintro"></p><div id="ridge"></div></section>
<section><h2 id="t-shift"></h2><p class="intro" id="t-shiftintro"></p><div id="shift"></div></section>
<section><h2 id="t-rank"></h2><p class="intro" id="t-rankintro"></p><div id="rank"></div>
  <p style="margin-top:14px"><button class="btn" id="more"></button></p></section>
<section><h2 id="t-method"></h2><div class="method" id="method"></div><footer id="foot"></footer></section>
</main>

<script>
const DATA = /*__DATA__*/;
const LANGS = ["de", "en", "fr", "it"];

/* ---------- texts ---------- */
const TX = {
en: {title: "Switzerland’s nature clock",
  lede: n => `When does Switzerland turn to nature? ${n} words, searched in German, French, Italian, mark the Swiss year: from wild garlic in March to chestnuts in October, with morels for Christmas. The wolf is searched all year.`,
  meta: (a, b, d) => `Google Trends, Switzerland. Weekly data ${a}; monthly data ${b}. Pulled ${d}.`,
  seasons: {spring: "Spring peak", summer: "Summer peak", autumn: "Autumn peak", winter: "Winter peak", year: "All year"},
  dialnote: "Each ring is one word, ordered from the inside out by peak date. Colour strength: how far each week rises above the word’s quietest week, averaged over five years. Pale rings are searched evenly all year. White dot: peak week. Line: today.",
  now: "In season now", quiet: "a quiet week", peaks: "peaks", inseason: "in season", allyear: "searched all year",
  part: ["early", "mid-", "late"], partJoin: (p, m) => p === "mid-" ? `mid-${m}` : `${p} ${m}`,
  every: "Every year since 2004", choose: "Choose a word",
  f: {peak: "Peak", season: "In season", weeks: n => `${n} weeks above half the peak`, rhythm: "Yearly rhythm",
      volume: "Search volume", ref: "the German word “Pilze” alone = 100", shift: "Shift since 2004",
      dpd: v => `${v} days per decade`, ns: ", not significant", none: "not computed", noseason: "no season to track"},
  hm: ["Monthly search interest, scaled to the word’s own peak. One row per year.", " Dots: centre of each year’s season.", " Dashed lines: Google changed its data collection."],
  ridge: "The year in searches", ridgeintro: "The same words as curves, each scaled to its own peak. Read from top to bottom, they tell the Swiss nature calendar.",
  shift: "Is the season shifting?", shiftintro: "For each word: the centre of its season, year by year since 2004, as a trend in days per decade. Left of the line means earlier. Filled dots: the 95 % range excludes zero. Read with care: searches follow habits as well as nature.",
  earlier: "← earlier", later: "later →", dpdAxis: "days per decade", d: "d",
  rank: "How big each signal is",
  rankintro: c => `${c} candidate words, ranked by average Swiss search volume over five years, all three languages together. Reference: the German word “Pilze” alone = 100. Coloured: the selected words. Grey: left out, with the reason on hover.`,
  more: c => `Show all ${c} candidates`, fewer: "Show fewer",
  reasons: {"selected": "selected", "added by hand": "added by hand", "too little search volume": "too little search volume", "no clear yearly rhythm": "no clear yearly rhythm", "outside the top 20 by volume": "outside the top 20 by volume"},
  method: "Method",
  mp: ["<b>Data.</b> Google Trends, region Switzerland. One request per word with its German, French, Italian term. The three share one scale, so the clock adds them up. Weekly data from the past five years gives the shape of the year. Monthly data from 2004 shows change over time.",
       "<b>Choosing the words.</b> 61 candidates on plants, fungi, insects, birds, mammals. Each was pulled together with the German word “Pilze” as a fixed reference, which puts all of them on one volume scale. Words with too little volume or without a clear yearly rhythm (below 60 %) are left out; the twenty with the highest volume remain.",
       "<b>The wolf.</b> Added by hand. “Wolf”, “loup”, “lupo” carry other meanings, so the clock uses Google’s topic for the animal, which covers all languages. It is the most searched word of all, evenly through the year.",
       "<b>Yearly cycle.</b> Mean of each calendar week over five years, smoothed over three weeks. Peak = highest week. In season = weeks above half the peak. Yearly rhythm = (highest − lowest) / highest.",
       "<b>Shift.</b> For each year: the search-weighted mean date across the season’s months (half-peak months plus one on each side). Trend: Theil–Sen slope with its 95 % range. A year counts only if every month of the season has measurable searches; a trend needs ten such years. Words peaking in December or January, or without a clear season, are left out.",
       "<b>Limits.</b> Searches measure attention, not nature itself. News can create spikes. Google changed its data collection in 2011, 2016, 2022. Monthly steps make the shift coarse: a few days per decade is at the edge of what the data can show. A shift in searches can also come from new habits (e.g. buying blueberry bushes in spring). With twenty words tested, one or two may pass the 95 % test by chance."],
  foot: (d, b) => `Data: Google Trends, region Switzerland, pulled ${d}. Analysis: Matthias Häni, ${b}.`},

de: {title: "Die Naturuhr der Schweiz",
  lede: n => `Wann wendet sich die Schweiz der Natur zu? ${n} Wörter, gesucht auf Deutsch, Französisch, Italienisch, zeichnen das Schweizer Jahr nach: vom Bärlauch im März bis zu den Kastanien im Oktober, mit Morcheln zu Weihnachten. Der Wolf wird das ganze Jahr gesucht.`,
  meta: (a, b, d) => `Google Trends, Schweiz. Wochendaten ${a}; Monatsdaten ${b}. Abgerufen am ${d}.`,
  seasons: {spring: "Spitze im Frühling", summer: "Spitze im Sommer", autumn: "Spitze im Herbst", winter: "Spitze im Winter", year: "Ganzjährig"},
  dialnote: "Jeder Ring ist ein Wort, von innen nach aussen nach Spitzendatum geordnet. Farbstärke: wie weit jede Woche über der ruhigsten Woche des Worts liegt, gemittelt über fünf Jahre. Blasse Ringe werden das ganze Jahr gleichmässig gesucht. Weisser Punkt: Spitzenwoche. Linie: heute.",
  now: "Jetzt in Saison", quiet: "eine ruhige Woche", peaks: "Spitze", inseason: "Saison", allyear: "ganzjährig gesucht",
  part: ["Anfang", "Mitte", "Ende"], partJoin: (p, m) => `${p} ${m}`,
  every: "Jedes Jahr seit 2004", choose: "Wort wählen",
  f: {peak: "Spitze", season: "Saison", weeks: n => `${n} Wochen über der halben Spitze`, rhythm: "Jahresrhythmus",
      volume: "Suchvolumen", ref: "deutsches Wort «Pilze» allein = 100", shift: "Verschiebung seit 2004",
      dpd: v => `${v} Tage pro Jahrzehnt`, ns: ", nicht signifikant", none: "nicht berechnet", noseason: "keine Saison zum Verfolgen"},
  hm: ["Monatliches Suchinteresse, skaliert auf die eigene Spitze des Worts. Eine Zeile pro Jahr.", " Punkte: Mitte der Saison jedes Jahres.", " Gestrichelte Linien: Google hat die Datenerhebung geändert."],
  ridge: "Das Jahr in Suchanfragen", ridgeintro: "Dieselben Wörter als Kurven, jede auf ihre eigene Spitze skaliert. Von oben nach unten gelesen ergeben sie den Schweizer Naturkalender.",
  shift: "Verschiebt sich die Saison?", shiftintro: "Für jedes Wort: die Mitte seiner Saison, Jahr für Jahr seit 2004, als Trend in Tagen pro Jahrzehnt. Links der Linie heisst früher. Gefüllte Punkte: der 95-%-Bereich schliesst null aus. Mit Vorsicht lesen: Suchanfragen folgen Gewohnheiten, nicht nur der Natur.",
  earlier: "← früher", later: "später →", dpdAxis: "Tage pro Jahrzehnt", d: "T",
  rank: "Wie stark jedes Signal ist",
  rankintro: c => `${c} Kandidatenwörter, geordnet nach mittlerem Schweizer Suchvolumen über fünf Jahre, alle drei Sprachen zusammen. Referenz: das deutsche Wort «Pilze» allein = 100. Farbig: die ausgewählten Wörter. Grau: weggelassen, der Grund erscheint beim Darüberfahren.`,
  more: c => `Alle ${c} Kandidaten zeigen`, fewer: "Weniger zeigen",
  reasons: {"selected": "ausgewählt", "added by hand": "von Hand ergänzt", "too little search volume": "zu wenig Suchvolumen", "no clear yearly rhythm": "kein klarer Jahresrhythmus", "outside the top 20 by volume": "ausserhalb der Top 20 nach Volumen"},
  method: "Methode",
  mp: ["<b>Daten.</b> Google Trends, Region Schweiz. Eine Abfrage pro Wort mit dem deutschen, französischen, italienischen Begriff. Die drei teilen eine Skala, deshalb zählt die Uhr sie zusammen. Wochendaten der letzten fünf Jahre ergeben die Form des Jahres. Monatsdaten ab 2004 zeigen die Veränderung über die Zeit.",
       "<b>Auswahl der Wörter.</b> 61 Kandidaten zu Pflanzen, Pilzen, Insekten, Vögeln, Säugetieren. Jeder wurde zusammen mit dem deutschen Wort «Pilze» als fester Referenz abgefragt. So liegen alle auf einer Volumenskala. Wörter mit zu wenig Volumen oder ohne klaren Jahresrhythmus (unter 60 %) fallen weg; die zwanzig mit dem grössten Volumen bleiben.",
       "<b>Der Wolf.</b> Von Hand ergänzt. «Wolf», «loup», «lupo» haben andere Bedeutungen, deshalb nutzt die Uhr Googles Thema für das Tier, das alle Sprachen abdeckt. Er ist das meistgesuchte Wort überhaupt, gleichmässig übers Jahr.",
       "<b>Jahreszyklus.</b> Mittel jeder Kalenderwoche über fünf Jahre, über drei Wochen geglättet. Spitze = höchste Woche. Saison = Wochen über der halben Spitze. Jahresrhythmus = (höchster − tiefster Wert) / höchster Wert.",
       "<b>Verschiebung.</b> Pro Jahr: das suchgewichtete mittlere Datum über die Monate der Saison (Monate über der halben Spitze plus je einer davor und danach). Trend: Theil-Sen-Steigung mit 95-%-Bereich. Ein Jahr zählt nur, wenn jeder Monat der Saison messbare Suchanfragen hat; ein Trend braucht zehn solche Jahre. Wörter mit Spitze im Dezember oder Januar oder ohne klare Saison fallen weg.",
       "<b>Grenzen.</b> Suchanfragen messen Aufmerksamkeit, nicht die Natur selbst. Nachrichten können Spitzen erzeugen. Google hat die Datenerhebung 2011, 2016, 2022 geändert. Monatsschritte machen die Verschiebung grob: einige Tage pro Jahrzehnt liegen an der Grenze dessen, was die Daten zeigen können. Eine Verschiebung kann auch von neuen Gewohnheiten kommen (z. B. Heidelbeersträucher im Frühling kaufen). Bei zwanzig getesteten Wörtern können ein bis zwei den 95-%-Test zufällig bestehen."],
  foot: (d, b) => `Daten: Google Trends, Region Schweiz, abgerufen am ${d}. Analyse: Matthias Häni, ${b}.`},

fr: {title: "L’horloge nature de la Suisse",
  lede: n => `Quand la Suisse se tourne-t-elle vers la nature ? ${n} mots, recherchés en allemand, français, italien, rythment l’année suisse : de l’ail des ours en mars aux châtaignes en octobre, avec des morilles pour Noël. Le loup est recherché toute l’année.`,

  ridge: "L’année en recherches", ridgeintro: "Les mêmes mots en courbes, chacune rapportée à son propre pic. Lues de haut en bas, elles racontent le calendrier de la nature suisse.",

  rankintro: c => `${c} mots candidats, classés par volume moyen de recherche en Suisse sur cinq ans, les trois langues réunies. Référence : le mot allemand « Pilze » seul = 100. En couleur : les mots retenus. En gris : écartés, avec la raison au survol.`,

  method: "Méthode",
  mp: ["<b>Données.</b> Google Trends, région Suisse. Une requête par mot avec son terme allemand, français, italien. Les trois partagent une échelle, l’horloge les additionne donc. Les données hebdomadaires des cinq dernières années donnent la forme de l’année. Les données mensuelles depuis 2004 montrent l’évolution dans le temps.",
       "<b>Choix des mots.</b> 61 candidats : plantes, champignons, insectes, oiseaux, mammifères. Chacun a été extrait avec le mot allemand « Pilze » comme référence fixe, ce qui les place tous sur une même échelle de volume. Les mots avec trop peu de volume ou sans rythme annuel clair (moins de 60 %) sont écartés ; les vingt au plus fort volume restent.",
       "<b>Le loup.</b> Ajouté à la main. « Wolf », « loup », « lupo » ont d’autres sens ; l’horloge utilise donc le sujet Google pour l’animal, qui couvre toutes les langues. C’est le mot le plus recherché, de façon égale sur l’année.",

  foot: (d, b) => `Données : Google Trends, région Suisse, extraites le ${d}. Analyse : Matthias Häni, ${b}.`},

  ridge: "L’anno nelle ricerche", ridgeintro: "Le stesse parole come curve, ognuna scalata sul proprio picco. Lette dall’alto in basso, raccontano il calendario della natura svizzera.",

/* display names per language; missing ones fall back to the search terms */
const NAMES = {
  wolf: ["Wolf", "Wolf", "Loup", "Lupo"], pilze: ["Pilze", "Mushrooms", "Champignons", "Funghi"],
  igel: ["Igel", "Hedgehog", "Hérisson", "Riccio"], bienen: ["Bienen", "Bees", "Abeilles", "Api"],
  pollen: ["Pollen", "Pollen", "Pollen", "Polline"], ameisen: ["Ameisen", "Ants", "Fourmis", "Formiche"],
  marroni: ["Marroni", "Roast chestnuts", "Marrons chauds", "Caldarroste"], muecken: ["Mücken", "Mosquitoes", "Moustiques", "Zanzare"],
  zecken: ["Zecken", "Ticks", "Tiques", "Zecche"], baerlauch: ["Bärlauch", "Wild garlic", "Ail des ours", "Aglio orsino"],
  schnecken: ["Schnecken", "Slugs", "Limaces", "Lumache"], heidelbeeren: ["Heidelbeeren", "Blueberries", "Myrtilles", "Mirtilli"],
  spinnen: ["Spinnen", "Spiders", "Araignées", "Ragni"], morcheln: ["Morcheln", "Morels", "Morilles", "Spugnole"],
  wespen: ["Wespen", "Wasps", "Guêpes", "Vespe"], kastanien: ["Kastanien", "Chestnuts", "Châtaignes", "Castagne"],
  tulpen: ["Tulpen", "Tulips", "Tulipes", "Tulipani"], schmetterlinge: ["Schmetterlinge", "Butterflies", "Papillons", "Farfalle"],
  loewenzahn: ["Löwenzahn", "Dandelion", "Pissenlit", "Tarassaco"], steinpilze: ["Steinpilze", "Porcini", "Cèpes", "Porcini"],
  asiatische_hornisse: ["Asiatische Hornisse", "Asian hornet", "Frelon asiatique", "Calabrone asiatico"]
};
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

/* ---------- helpers ---------- */
const NS = "http://www.w3.org/2000/svg";
const COL = {spring: "#5B8C3A", summer: "#C9A227", autumn: "#B5562B", winter: "#3E6E8E", year: "#7D8471"};
const svgEl = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const txt = (parent, x, y, s, attrs = {}) => { const e = svgEl("text", Object.assign({x, y}, attrs), parent); e.textContent = s; return e; };
const fmt = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const weekDate = w => new Date(Date.UTC(2025, 0, 1 + (w - 1) * 7 + 3));
const isoWeek = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n); const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.min(52, Math.ceil(((t - y0) / 864e5 + 1) / 7)); };
const NOW = isoWeek(new Date());
const yearRound = t => t.season === "year";
const T = DATA.topics.slice().sort((a, b) => (yearRound(a) - yearRound(b)) || (a.peak_week - b.peak_week));
const byKey = Object.fromEntries(T.map(t => [t.key, t]));

let L = "en", tx = TX.en, MON = [], MONL = [], current = null, hooks = [];
const setMonths = () => {
  MON = [...Array(12)].map((_, m) => new Intl.DateTimeFormat(L, {month: "short", timeZone: "UTC"}).format(new Date(Date.UTC(2025, m, 15))).replace(".", ""));
  MONL = [...Array(12)].map((_, m) => new Intl.DateTimeFormat(L, {month: "long", timeZone: "UTC"}).format(new Date(Date.UTC(2025, m, 15))));
};
const name = t => { const i = LANGS.indexOf(L); const n = NAMES[t.key]; return (n && n[i]) || (L === "fr" && cap(t.fr)) || (L === "it" && cap(t.it)) || t.de; };
const others = t => { const i = LANGS.indexOf(L); const n = NAMES[t.key]; return n ? LANGS.map((l, j) => j !== i && l !== "en" ? n[j] : null).filter((v, j, a) => v && a.indexOf(v) === j && v !== n[i]).join(" · ") : [t.fr, t.it].filter(Boolean).join(" · "); };
const weekLabel = w => { const d = weekDate(w), day = d.getUTCDate(); const p = tx.part[day <= 10 ? 0 : day <= 20 ? 1 : 2]; return tx.partJoin(p, MONL[d.getUTCMonth()]); };
const shortWeek = w => { const d = weekDate(w), day = d.getUTCDate(); const p = tx.part[day <= 10 ? 0 : day <= 20 ? 1 : 2]; return tx.partJoin(p, MON[d.getUTCMonth()]); };
const span = t => { const a = MON[weekDate(t.start_week).getUTCMonth()], b = MON[weekDate(t.end_week).getUTCMonth()]; return a === b ? a : `${a}–${b}`; };
const ym = s => s ? `${MON[+s.slice(5, 7) - 1]} ${s.slice(0, 4)}` : "";
const dmy = s => { const d = new Date(s + "T12:00:00Z"); return new Intl.DateTimeFormat(L, {day: "numeric", month: "long", year: "numeric", timeZone: "UTC"}).format(d); };
const select = k => { current = k; hooks.forEach(f => f(k)); };
const clear = id => { const e = document.getElementById(id); e.innerHTML = ""; return e; };
const set = (id, s) => { document.getElementById(id).textContent = s; };

/* ---------- dial ---------- */
function drawDial() {
  const box = clear("dial"), cal = clear("cal");
  const S = 720, c = S / 2, r0 = 112, r1 = 318, n = T.length, step = (r1 - r0) / n;
  const svg = svgEl("svg", {viewBox: `0 0 ${S} ${S}`, role: "img", "aria-label": tx.title}, box);
  const A = w => (w / 52) * 2 * Math.PI, P = (a, r) => [c + r * Math.sin(a), c - r * Math.cos(a)];
  const arc = (r, a0, a1) => { const [x0, y0] = P(a0, r), [x1, y1] = P(a1, r); return `M${x0},${y0}A${r},${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1},${y1}`; };
  for (let m = 0; m < 12; m++) {
    const [x1, y1] = P(m / 12 * 2 * Math.PI, r0 - 6), [x2, y2] = P(m / 12 * 2 * Math.PI, r1 + 6);
    svgEl("line", {x1, y1, x2, y2, stroke: "#DDD8CC"}, svg);
    const [lx, ly] = P((m + .5) / 12 * 2 * Math.PI, r1 + 24);
    txt(svg, lx, ly, MON[m], {"text-anchor": "middle", "dominant-baseline": "middle", "font-size": 14, fill: "#6E736B"});
  }
  const rings = svgEl("g", {}, svg);
  T.forEach((t, i) => {
    const r = r0 + step * (i + .5), g = svgEl("g", {class: "ring", "data-key": t.key}, rings);
    svgEl("circle", {cx: c, cy: c, r, fill: "none", stroke: "#E9E4D8", "stroke-width": step - 1.5}, g);
    const lo = Math.min(...t.cycle);
    if (yearRound(t)) svgEl("circle", {cx: c, cy: c, r, fill: "none", stroke: COL.year, "stroke-opacity": .35, "stroke-width": step - 1.5}, g);
    else for (let w = 0; w < 52; w++) {
      const v = (t.cycle[w] - lo) / 100; if (v < .03) continue;
      svgEl("path", {d: arc(r, A(w), A(w + 1) + .004), fill: "none", stroke: COL[t.season], "stroke-width": step - 1.5, "stroke-opacity": Math.pow(v, 1.3).toFixed(3)}, g);
    }
    if (!yearRound(t)) { const [px, py] = P(A(t.peak_week - .5), r); svgEl("circle", {cx: px, cy: py, r: 2.4, fill: "#fff"}, g); }
    svgEl("title", {}, g).textContent = name(t);
    g.addEventListener("mouseenter", () => select(t.key));
    g.addEventListener("click", () => select(t.key));
  });
  const [hx, hy] = P(A(NOW - .5), r1 + 8), [hx0, hy0] = P(A(NOW - .5), r0 - 10);
  svgEl("line", {x1: hx0, y1: hy0, x2: hx, y2: hy, stroke: "#1F2A24", "stroke-width": 1.4}, svg);
  const center = svgEl("g", {}, svg);
  const paint = k => {
    center.innerHTML = "";
    if (!k) {
      const now = T.filter(t => !yearRound(t)).sort((a, b) => b.cycle[NOW - 1] - a.cycle[NOW - 1]).slice(0, 3).filter(t => t.cycle[NOW - 1] > 20);
      txt(center, c, c - 34, tx.now, {"text-anchor": "middle", "font-size": 13, fill: "#6E736B"});
      (now.length ? now.map(name) : [tx.quiet]).forEach((s, j) => txt(center, c, c - 6 + j * 26, s, {"text-anchor": "middle", "font-size": 21, "font-family": "Fraunces,Georgia,serif", fill: "#1F2A24"}));
      return;
    }
    const t = byKey[k];
    txt(center, c, c - 16, name(t), {"text-anchor": "middle", "font-size": 26, "font-family": "Fraunces,Georgia,serif", "font-weight": 600, fill: COL[t.season]});
    if (yearRound(t)) { txt(center, c, c + 14, tx.allyear, {"text-anchor": "middle", "font-size": 13.5, fill: "#3A443E"}); return; }
    txt(center, c, c + 12, `${tx.peaks} ${weekLabel(t.peak_week)}`, {"text-anchor": "middle", "font-size": 13.5, fill: "#3A443E"});
    txt(center, c, c + 32, `${tx.inseason} ${span(t)}`, {"text-anchor": "middle", "font-size": 13.5, fill: "#6E736B"});
  };
  paint(null);
  const reset = () => { svg.classList.remove("dim"); paint(null); cal.querySelectorAll("li").forEach(li => li.classList.remove("on")); };
  svg.addEventListener("mouseleave", reset);
  hooks.push(k => { svg.classList.add("dim"); rings.querySelectorAll(".ring").forEach(g => g.classList.toggle("on", g.dataset.key === k)); paint(k);
                    cal.querySelectorAll("li").forEach(li => li.classList.toggle("on", li.dataset.key === k)); });
  T.forEach(t => {
    const li = document.createElement("li"); li.dataset.key = t.key;
    li.innerHTML = `<i style="background:${COL[t.season]}"></i><span></span><small></small>`;
    li.children[1].textContent = name(t);
    li.children[2].textContent = yearRound(t) ? tx.seasons.year : shortWeek(t.peak_week);
    li.addEventListener("mouseenter", () => select(t.key));
    li.addEventListener("click", () => { select(t.key); document.getElementById("detail-sec").scrollIntoView({behavior: "smooth"}); });
    cal.appendChild(li);
  });
  cal.addEventListener("mouseleave", reset);
  return reset;
}

/* ---------- detail ---------- */
function drawDetail() {
  const sel = clear("sel");
  T.forEach(t => { const o = document.createElement("option"); o.value = t.key; o.textContent = name(t); sel.appendChild(o); });
  sel.onchange = () => select(sel.value);
  hooks.push(k => {
    const t = byKey[k], f = tx.f, sh = t.shift; sel.value = k;
    set("dname", name(t)); document.getElementById("dname").style.color = COL[t.season];
    set("dlang", others(t));
    const vol = `${t.volume.toFixed(t.volume < 10 ? 1 : 0)} (${f.ref})`;
    const rows = yearRound(t)
      ? [[f.season, tx.seasons.year], [f.rhythm, Math.round(t.seasonality * 100) + " %"], [f.volume, vol], [f.shift, f.noseason]]
      : [[f.peak, weekLabel(t.peak_week)], [f.season, `${span(t)} (${f.weeks(t.weeks_above_half)})`], [f.rhythm, Math.round(t.seasonality * 100) + " %"],
         [f.volume, vol], [f.shift, sh ? f.dpd(fmt(sh.days_per_decade)) + (sh.significant ? "" : f.ns) : f.none]];
    const ul = clear("facts");
    rows.forEach(([a, b]) => { const li = document.createElement("li"); li.innerHTML = "<b></b><span></span>"; li.children[0].textContent = a; li.children[1].textContent = b; ul.appendChild(li); });
    const heat = clear("heat"), m = t.monthly; if (!m) return;
    const y0 = +m.start.slice(0, 4), mo0 = +m.start.slice(5, 7) - 1, years = Math.ceil((mo0 + m.values.length) / 12);
    const W = 760, LL = 44, cw = (W - LL) / 12, ch = 15, H = years * ch + 26;
    const svg = svgEl("svg", {viewBox: `0 0 ${W} ${H}`}, heat);
    MON.forEach((mn, i) => txt(svg, LL + cw * (i + .5), 12, mn, {"text-anchor": "middle", "font-size": 11.5, fill: "#6E736B"}));
    for (let y = 0; y < years; y++) txt(svg, LL - 8, 26 + y * ch + ch * .72, y0 + y, {"text-anchor": "end", "font-size": 10.5, fill: "#6E736B"});
    m.values.forEach((v, i) => {
      const idx = mo0 + i, y = Math.floor(idx / 12), mm = idx % 12;
      svgEl("rect", {x: LL + mm * cw + .5, y: 20 + y * ch + .5, width: cw - 1, height: ch - 1, fill: v == null ? "#EFEBE1" : COL[t.season], "fill-opacity": v == null ? 1 : Math.max(.05, Math.pow(v / 100, .9)).toFixed(3)}, svg);
    });
    (DATA.breaks || []).forEach(b => { if (b > y0 && b < y0 + years) { const yy = 20 + (b - y0) * ch; svgEl("line", {x1: LL - 4, x2: W, y1: yy, y2: yy, stroke: "#1F2A24", "stroke-width": .8, "stroke-dasharray": "2 3"}, svg); } });
    if (sh) Object.entries(sh.years).forEach(([yr, d]) => svgEl("circle", {cx: LL + (d - 1) / 365.25 * 12 * cw, cy: 20 + (+yr - y0) * ch + ch / 2, r: 2.6, fill: "#1F2A24"}, svg));
    set("hmnote", tx.hm[0] + (sh ? tx.hm[1] : "") + tx.hm[2]);
  });
}

/* ---------- ridgeline ---------- */
function drawRidge() {
  const box = clear("ridge");
  const W = 1000, LL = 170, R = 990, rowH = 30, amp = 62, top = 30, H = top + T.length * rowH + 20;
  const svg = svgEl("svg", {viewBox: `0 0 ${W} ${H}`}, box);
  const X = w => LL + (w - .5) / 52 * (R - LL);
  for (let m = 0; m <= 12; m++) {
    const x = LL + m / 12 * (R - LL);
    svgEl("line", {x1: x, x2: x, y1: top - 8, y2: H - 10, stroke: "#E4DFD3"}, svg);
    if (m < 12) txt(svg, x + (R - LL) / 24, top - 14, MON[m], {"text-anchor": "middle", "font-size": 13, fill: "#6E736B"});
  }
  svgEl("line", {x1: X(NOW), x2: X(NOW), y1: top - 8, y2: H - 10, stroke: "#1F2A24"}, svg);
  const groups = [];
  T.forEach((t, i) => {
    const base = top + (i + 1) * rowH, g = svgEl("g", {class: "hl"}, svg);
    let d = `M${X(1) - 6},${base}`;
    for (let w = 1; w <= 52; w++) d += `L${X(w)},${base - t.cycle[w - 1] / 100 * amp}`;
    svgEl("path", {d: d + `L${X(52) + 6},${base}Z`, fill: COL[t.season], "fill-opacity": .82, stroke: "#F5F2EA", "stroke-width": 1.4}, g);
    txt(g, LL - 12, base - 4, name(t), {"text-anchor": "end", "font-size": 13.5, fill: "#1F2A24"});
    g.addEventListener("mouseenter", () => { select(t.key); groups.forEach(x => x.style.opacity = x === g ? 1 : .55); });
    groups.push(g);
  });
  svg.addEventListener("mouseleave", () => groups.forEach(g => g.style.opacity = 1));
}

/* ---------- shift ---------- */
function drawShift() {
  const box = clear("shift");
  const S = T.filter(t => t.shift).sort((a, b) => a.shift.days_per_decade - b.shift.days_per_decade);
  if (!S.length) return;
  const W = 1000, LL = 190, R = 880, rowH = 26, top = 34, H = top + S.length * rowH + 30;
  const lim = Math.max(10, ...S.map(t => Math.max(Math.abs(t.shift.ci95_low), Math.abs(t.shift.ci95_high))));
  const X = v => LL + (v + lim) / (2 * lim) * (R - LL);
  const svg = svgEl("svg", {viewBox: `0 0 ${W} ${H}`}, box);
  const tick = lim > 30 ? 20 : lim > 15 ? 10 : 5;
  for (let v = -Math.floor(lim / tick) * tick; v <= lim; v += tick) {
    svgEl("line", {x1: X(v), x2: X(v), y1: top - 6, y2: H - 22, stroke: v === 0 ? "#1F2A24" : "#E4DFD3", "stroke-width": v === 0 ? 1.2 : 1}, svg);
    txt(svg, X(v), H - 6, fmt(v, 0).replace(/^\+?0$/, "0"), {"text-anchor": "middle", "font-size": 12, fill: "#6E736B"});
  }
  txt(svg, X(-lim), top - 16, tx.earlier, {"font-size": 12.5, fill: "#6E736B"});
  txt(svg, X(lim), top - 16, tx.later, {"font-size": 12.5, fill: "#6E736B", "text-anchor": "end"});
  txt(svg, W, H - 6, tx.dpdAxis, {"font-size": 12, fill: "#6E736B", "text-anchor": "end"});
  S.forEach((t, i) => {
    const y = top + i * rowH + rowH / 2, s = t.shift, g = svgEl("g", {class: "hl"}, svg);
    svgEl("rect", {x: 0, y: y - rowH / 2, width: W, height: rowH, fill: "transparent"}, g);
    txt(g, LL - 14, y + 4.5, name(t), {"text-anchor": "end", "font-size": 13.5, fill: "#1F2A24"});
    svgEl("line", {x1: X(s.ci95_low), x2: X(s.ci95_high), y1: y, y2: y, stroke: COL[t.season], "stroke-width": 2, "stroke-opacity": .55}, g);
    svgEl("circle", {cx: X(s.days_per_decade), cy: y, r: 5, fill: s.significant ? COL[t.season] : "#F5F2EA", stroke: COL[t.season], "stroke-width": 2}, g);
    txt(g, R + 20, y + 4.5, `${fmt(s.days_per_decade)} ${tx.d}`, {"font-size": 13, fill: "#3A443E"});
    g.addEventListener("mouseenter", () => select(t.key));
    g.addEventListener("click", () => { select(t.key); document.getElementById("detail-sec").scrollIntoView({behavior: "smooth"}); });
  });
}

/* ---------- ranking ---------- */
let showAll = false;
function drawRank() {
  const C = DATA.candidates.slice().sort((a, b) => b.volume - a.volume);
  set("t-rankintro", tx.rankintro(C.length));
  const box = clear("rank"), rows = showAll ? C : C.slice(0, 32);
  const W = 1000, LL = 190, R = 900, rowH = 21, H = rows.length * rowH + 10;
  const max = C[0].volume, X = v => LL + v / max * (R - LL);
  const svg = svgEl("svg", {viewBox: `0 0 ${W} ${H}`}, box);
  rows.forEach((c, i) => {
    const y = i * rowH + 4, t = byKey[c.key], g = svgEl("g", t ? {class: "hl"} : {}, svg);
    txt(g, LL - 12, y + 13, t ? name(t) : c.de, {"text-anchor": "end", "font-size": 13, fill: t ? "#1F2A24" : "#8A8E86"});
    svgEl("rect", {x: LL, y: y + 2, width: Math.max(1.5, X(c.volume) - LL), height: rowH - 7, fill: t ? COL[t.season] : "#CFC9BB"}, g);
    txt(g, X(c.volume) + 8, y + 13, c.volume.toFixed(c.volume < 10 ? 1 : 0), {"font-size": 12, fill: "#6E736B"});
    svgEl("title", {}, g).textContent = `${t ? name(t) : c.de}: ${tx.reasons[c.reason] || c.reason}`;
    if (t) g.addEventListener("mouseenter", () => select(t.key));
  });
  const more = document.getElementById("more");
  more.textContent = showAll ? tx.fewer : tx.more(C.length);
  more.onclick = () => { showAll = !showAll; drawRank(); };
}

/* ---------- page ---------- */
function render(lang) {
  L = LANGS.includes(lang) ? lang : "en"; tx = TX[L]; setMonths(); hooks = [];
  document.documentElement.lang = L; document.title = tx.title;
  document.getElementById("lang").innerHTML = LANGS.map(l => `<a href="#${l}" class="${l === L ? "on" : ""}">${l.toUpperCase()}</a>`).join("");
  set("t-title", tx.title); set("t-lede", tx.lede(T.length));
  set("t-meta", tx.meta(DATA.period_5y ? `${ym(DATA.period_5y[0])} – ${ym(DATA.period_5y[1])}` : "", DATA.period_all ? `${ym(DATA.period_all[0])} – ${ym(DATA.period_all[1])}` : "", dmy(DATA.pulled)));
  const used = new Set(T.map(t => t.season));
  document.getElementById("t-seasons").innerHTML = ["spring", "summer", "autumn", "winter", "year"].filter(s => used.has(s)).map(s => `<span style="--c:${COL[s]}">${tx.seasons[s]}</span>`).join("");
  set("t-dialnote", tx.dialnote); set("t-choose", tx.choose); set("t-every", tx.every);
  set("t-ridge", tx.ridge); set("t-ridgeintro", tx.ridgeintro); set("t-shift", tx.shift); set("t-shiftintro", tx.shiftintro);
  set("t-rank", tx.rank); set("t-method", tx.method);
  document.getElementById("method").innerHTML = tx.mp.map(p => `<p>${p}</p>`).join("");
  set("foot", tx.foot(dmy(DATA.pulled), dmy(DATA.built)));
  const reset = drawDial(); drawDetail(); drawRidge(); drawShift(); drawRank();
  const start = current || T.filter(t => !yearRound(t)).sort((a, b) => b.cycle[NOW - 1] - a.cycle[NOW - 1])[0].key;
  select(start); reset();
}
const fromHash = () => location.hash.slice(1).toLowerCase();
const fromBrowser = () => (navigator.language || "en").slice(0, 2).toLowerCase();
window.addEventListener("hashchange", () => render(fromHash()));
render(LANGS.includes(fromHash()) ? fromHash() : (LANGS.includes(fromBrowser()) ? fromBrowser() : "en"));
</script>
